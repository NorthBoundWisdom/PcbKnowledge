global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: pcbknowledge-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel-collector
    sample_limit: 20000
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:9464"]

  - job_name: pcbknowledge-api
    metrics_path: /metrics
    sample_limit: 20000
    static_configs:
      - targets: ["api:8000"]

  - job_name: keycloak
    metrics_path: /metrics
    sample_limit: 20000
    static_configs:
      - targets: ["keycloak:9000"]
