groups:
  - name: pcbknowledge-platform
    rules:
      - alert: PcbKnowledgeApiUnavailable
        expr: up{job="pcbknowledge-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PcbKnowledge API metrics endpoint is unavailable

      - alert: PcbKnowledgeIdentityUnavailable
        expr: up{job="keycloak"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Keycloak metrics endpoint is unavailable

      - alert: PcbKnowledgeTelemetryCollectorUnavailable
        expr: min(up{job="otel-collector"}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An OpenTelemetry Collector endpoint is unavailable

      - alert: PcbKnowledgeTelemetryExportFailures
        expr: increase(otelcol_exporter_send_failed_metric_points[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: OpenTelemetry metric export failures were observed
