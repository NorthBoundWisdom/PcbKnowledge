name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types, tests, contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src apps tests configs
      - name: Hermetic unit tests
        run: >-
          uv run pytest
          --ignore=tests/test_m1_postgres_security.py
          --ignore=tests/test_m1_security_repair_postgres.py
          --ignore=tests/test_database_contract_postgres.py
          --ignore=tests/platform_jobs/test_jobs_postgres.py
          --ignore=tests/platform_outbox/test_outbox_postgres.py
          --ignore=tests/platform_outbox/test_storage_cleanup_worker_integration.py
          --ignore=tests/platform_storage/test_storage_postgres.py
          --ignore=tests/platform_storage/test_storage_seaweedfs.py
      - name: OpenAPI drift
        run: uv run pcbknowledge-openapi --check

  m1-integration:
    name: M1 PostgreSQL and SeaweedFS integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Start disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          database_password=$(openssl rand -hex 32)
          application_password=$(openssl rand -hex 32)
          worker_password=$(openssl rand -hex 32)
          echo "::add-mask::$database_password"
          echo "::add-mask::$application_password"
          echo "::add-mask::$worker_password"
          database_name=pcbknowledge_m1_test_ci
          database_dsn="postgresql+psycopg://pcbknowledge:${database_password}@127.0.0.1:55432/${database_name}"
          echo "PCBKNOWLEDGE_DATABASE_DSN=$database_dsn" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_TEST_DATABASE_DSN=$database_dsn" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_RUN_POSTGRES_TESTS=1" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_APP_PASSWORD=$application_password" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_WORKER_PASSWORD=$worker_password" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_APP_DATABASE_DSN=postgresql+psycopg://pcbknowledge_app:${application_password}@127.0.0.1:55432/${database_name}" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_WORKER_DATABASE_DSN=postgresql+psycopg://pcbknowledge_worker:${worker_password}@127.0.0.1:55432/${database_name}" >>"$GITHUB_ENV"
          postgres_environment="$RUNNER_TEMP/pcbknowledge-postgres.env"
          printf 'POSTGRES_DB=%s\nPOSTGRES_USER=pcbknowledge\nPOSTGRES_PASSWORD=%s\n' \
            "$database_name" "$database_password" >"$postgres_environment"
          chmod 600 "$postgres_environment"
          docker run --detach --name pcbknowledge-ci-m1-postgres \
            --env-file "$postgres_environment" \
            --publish 127.0.0.1:55432:5432 \
            pgvector/pgvector:pg18
          for attempt in $(seq 1 30); do
            if docker exec pcbknowledge-ci-m1-postgres \
              pg_isready --username=pcbknowledge --dbname="$database_name"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Migrate disposable PostgreSQL
        run: uv run alembic -c migrations/alembic.ini upgrade head
      - name: Reconcile disposable runtime logins
        shell: bash
        run: |
          docker exec --interactive pcbknowledge-ci-m1-postgres \
            psql --username=pcbknowledge --dbname=pcbknowledge_m1_test_ci \
            --set ON_ERROR_STOP=1 \
            --set application_password="$PCBKNOWLEDGE_M1_APP_PASSWORD" \
            --set worker_password="$PCBKNOWLEDGE_M1_WORKER_PASSWORD" <<'SQL'
          ALTER ROLE pcbknowledge_app
            WITH LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE
            NOREPLICATION NOBYPASSRLS PASSWORD :'application_password';
          ALTER ROLE pcbknowledge_worker
            WITH LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE
            NOREPLICATION NOBYPASSRLS PASSWORD :'worker_password';
          SQL
      - name: Start disposable SeaweedFS S3
        shell: bash
        run: |
          set -euo pipefail
          api_access_key=$(openssl rand -hex 16)
          api_secret_key=$(openssl rand -hex 32)
          admin_access_key=$(openssl rand -hex 16)
          admin_secret_key=$(openssl rand -hex 32)
          worker_access_key=$(openssl rand -hex 16)
          worker_secret_key=$(openssl rand -hex 32)
          for secret in "$api_access_key" "$api_secret_key" \
            "$admin_access_key" "$admin_secret_key" \
            "$worker_access_key" "$worker_secret_key"; do
            echo "::add-mask::$secret"
          done
          content_bucket=pcbknowledge-m1-ci
          staging_bucket=pcbknowledge-m1-ci-staging
          s3_config="$RUNNER_TEMP/pcbknowledge-seaweedfs-s3.json"
          printf '%s\n' \
            '{"identities":[' \
            '{"name":"admin","credentials":[{"accessKey":"'"$admin_access_key"'","secretKey":"'"$admin_secret_key"'"}],"actions":["Admin"]},' \
            '{"name":"api","credentials":[{"accessKey":"'"$api_access_key"'","secretKey":"'"$api_secret_key"'"}],"actions":["Read:'"$content_bucket"'","List:'"$content_bucket"'","Read:'"$staging_bucket"'","Write:'"$staging_bucket"'","List:'"$staging_bucket"'"]},' \
            '{"name":"worker","credentials":[{"accessKey":"'"$worker_access_key"'","secretKey":"'"$worker_secret_key"'"}],"actions":["Write:'"$staging_bucket"'"]}' \
            ']}' \
            >"$s3_config"
          chmod 600 "$s3_config"
          echo "PCBKNOWLEDGE_M1_S3_ENDPOINT_URL=http://127.0.0.1:58333" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_S3_PUBLIC_ENDPOINT_URL=http://127.0.0.1:58333" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_S3_ACCESS_KEY=$api_access_key" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_S3_SECRET_KEY=$api_secret_key" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_S3_ADMIN_ACCESS_KEY=$admin_access_key" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_S3_ADMIN_SECRET_KEY=$admin_secret_key" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_S3_WORKER_ACCESS_KEY=$worker_access_key" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_S3_WORKER_SECRET_KEY=$worker_secret_key" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_S3_BUCKET=$content_bucket" >>"$GITHUB_ENV"
          echo "PCBKNOWLEDGE_M1_S3_STAGING_BUCKET=$staging_bucket" >>"$GITHUB_ENV"
          docker run --detach --name pcbknowledge-ci-m1-seaweedfs \
            --volume "$s3_config:/etc/seaweedfs/pcbknowledge-s3.json:ro" \
            --publish 127.0.0.1:58333:8333 \
            --publish 127.0.0.1:59333:9333 \
            chrislusf/seaweedfs:3.85 \
            server -dir=/data -master.port=9333 -volume.port=8080 \
            -filer -filer.port=8888 -s3 -s3.port=8333 \
            -s3.config=/etc/seaweedfs/pcbknowledge-s3.json
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:59333/cluster/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: PostgreSQL integration tests
        run: >-
          uv run pytest -ra
          --junitxml="$RUNNER_TEMP/m1-postgres.xml"
          tests/test_m1_postgres_security.py
          tests/test_m1_security_repair_postgres.py
          tests/platform_jobs/test_jobs_postgres.py
          tests/platform_outbox/test_outbox_postgres.py
          tests/platform_outbox/test_storage_cleanup_worker_integration.py
          tests/platform_storage/test_storage_postgres.py
      - name: Actual application runtime contract
        env:
          PCBKNOWLEDGE_EXPECTED_RUNTIME_ROLE: pcbknowledge_app
        run: |
          PCBKNOWLEDGE_DATABASE_DSN="$PCBKNOWLEDGE_M1_APP_DATABASE_DSN" \
            uv run pytest -ra tests/test_database_contract_postgres.py
      - name: Actual worker runtime contract
        env:
          PCBKNOWLEDGE_EXPECTED_RUNTIME_ROLE: pcbknowledge_worker
        run: |
          PCBKNOWLEDGE_DATABASE_DSN="$PCBKNOWLEDGE_M1_WORKER_DATABASE_DSN" \
            uv run pytest -ra tests/test_database_contract_postgres.py
      - name: Assert PostgreSQL tests did not skip
        env:
          REPORT_PATH: ${{ runner.temp }}/m1-postgres.xml
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          cases = ET.parse(os.environ["REPORT_PATH"]).findall(".//testcase")
          skipped = [case for case in cases if case.find("skipped") is not None]
          print(f"PostgreSQL integration receipt: {len(cases)} tests, {len(skipped)} skipped")
          if skipped:
              raise SystemExit("PostgreSQL integration tests must not skip in CI")
          PY
      - name: SeaweedFS integration tests
        run: >-
          uv run pytest -ra
          --junitxml="$RUNNER_TEMP/m1-seaweedfs.xml"
          tests/platform_storage/test_storage_seaweedfs.py
      - name: Assert SeaweedFS tests did not skip
        env:
          REPORT_PATH: ${{ runner.temp }}/m1-seaweedfs.xml
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          cases = ET.parse(os.environ["REPORT_PATH"]).findall(".//testcase")
          skipped = [case for case in cases if case.find("skipped") is not None]
          print(f"SeaweedFS integration receipt: {len(cases)} tests, {len(skipped)} skipped")
          if skipped:
              raise SystemExit("SeaweedFS integration tests must not skip in CI")
          PY
      - name: Stop disposable integration services
        if: always()
        run: |
          docker rm --force pcbknowledge-ci-m1-seaweedfs || true
          docker rm --force pcbknowledge-ci-m1-postgres || true
          rm -f "$RUNNER_TEMP/pcbknowledge-postgres.env"
          rm -f "$RUNNER_TEMP/pcbknowledge-seaweedfs-s3.json"

  migrations:
    name: PostgreSQL migration round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Start PostgreSQL with a runtime-generated credential
        shell: bash
        run: |
          set -euo pipefail
          database_password=$(openssl rand -hex 32)
          echo "::add-mask::$database_password"
          echo "PCBKNOWLEDGE_DATABASE_DSN=postgresql+psycopg://pcbknowledge:${database_password}@127.0.0.1:55432/pcbknowledge" >>"$GITHUB_ENV"
          docker run --detach --name pcbknowledge-ci-postgres \
            --env POSTGRES_DB=pcbknowledge \
            --env POSTGRES_USER=pcbknowledge \
            --env POSTGRES_PASSWORD="$database_password" \
            --publish 127.0.0.1:55432:5432 \
            pgvector/pgvector:pg18
          for attempt in $(seq 1 30); do
            if docker exec pcbknowledge-ci-postgres pg_isready --username=pcbknowledge --dbname=pcbknowledge; then
              exit 0
            fi
            sleep 1
          done
          docker logs pcbknowledge-ci-postgres
          exit 1
      - name: Upgrade, downgrade, and re-upgrade
        run: |
          uv run alembic -c migrations/alembic.ini upgrade head
          uv run alembic -c migrations/alembic.ini downgrade base
          uv run alembic -c migrations/alembic.ini upgrade head
      - name: Verify legacy receipt provenance repair
        run: |
          uv run alembic -c migrations/alembic.ini downgrade 20260808_0006
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["PCBKNOWLEDGE_DATABASE_DSN"])
          with engine.begin() as connection:
              organization_id = connection.scalar(text(
                  "INSERT INTO identity.organization (id, slug, display_name) "
                  "VALUES (uuidv7(), 'legacy-receipt', 'Legacy receipt') RETURNING id"
              ))
              job_id = connection.scalar(text(
                  "INSERT INTO platform.knowledge_job "
                  "(organization_id, access_scope, job_type, payload, payload_sha256, "
                  "idempotency_key, attempts) VALUES (:organization_id, 'ORGANIZATION', "
                  "'migration.receipt', '{}'::jsonb, :digest, 'legacy-receipt', 5) "
                  "RETURNING id"
              ), {"organization_id": organization_id, "digest": "0" * 64})
              connection.execute(text(
                  "INSERT INTO platform.job_effect_receipt "
                  "(job_id, organization_id, access_scope, effect_name, effect_sha256, "
                  "lease_attempt) VALUES (:job_id, :organization_id, 'ORGANIZATION', "
                  "'legacy.effect', :digest, 5)"
              ), {
                  "job_id": job_id,
                  "organization_id": organization_id,
                  "digest": "1" * 64,
              })
          engine.dispose()
          PY
          uv run alembic -c migrations/alembic.ini upgrade head
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["PCBKNOWLEDGE_DATABASE_DSN"])
          with engine.connect() as connection:
              repaired = connection.execute(text(
                  "SELECT lease_attempt, lease_owner FROM platform.job_effect_receipt "
                  "WHERE effect_name = 'legacy.effect'"
              )).one()
              if repaired.lease_attempt is not None or repaired.lease_owner is not None:
                  raise SystemExit("legacy receipt provenance was presented as verified")
          engine.dispose()
          PY
      - name: Stop PostgreSQL
        if: always()
        run: docker rm --force pcbknowledge-ci-postgres || true

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.20.0"
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated API client drift
        run: pnpm check:generated
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: FreeCM/vscode-extension/package-lock.json
      - name: Validate FreeCM repository commands
        run: |
          npm ci --no-audit --prefix FreeCM/vscode-extension
          python3 configs/validate_freecm_repo_commands.py
      - name: Validate shell and committed JSON syntax
        run: |
          find deploy -type f -name '*.sh' -exec sh -n {} \;
          for json_file in \
            deploy/keycloak/pcbknowledge-realm.template.json \
            deploy/keycloak/pcbknowledge-api-client.json \
            deploy/keycloak/pcbknowledge-curator-client.json \
            deploy/keycloak/pcbknowledge-agent-client.template.json \
            deploy/observability/grafana/dashboards/m1-platform.json; do
            python -m json.tool "$json_file" >/dev/null
          done
          test "$(grep -h -o '__PCBKNOWLEDGE_AGENT_SERVICE_SECRET__' \
            deploy/keycloak/*.template.json | wc -l)" -eq 2
      - name: Validate cold-start role reconciliation order
        run: |
          python - <<'PY'
          from pathlib import Path

          commands = [
              line.strip()
              for line in Path("deploy/scripts/dev-up.sh").read_text().splitlines()
          ]
          migration = commands.index("docker compose run --rm migrate")
          roles = commands.index("docker compose run --rm postgres-reconcile")
          runtime = commands.index("docker compose up --detach --wait api worker web caddy")
          if not migration < roles < runtime:
              raise SystemExit("runtime roles must be reconciled after migration and before startup")
          PY
      - name: Validate runtime Keycloak rendering
        run: |
          ./deploy/scripts/bootstrap-secrets.sh
          python -m json.tool deploy/secrets/keycloak-realm.json >/dev/null
          python -m json.tool deploy/secrets/keycloak-agent-client.json >/dev/null
          test "$(stat -c '%a' deploy/secrets/keycloak-realm.json)" = 600
          test "$(stat -c '%a' deploy/secrets/keycloak-agent-client.json)" = 600
          ! grep -q '__PCBKNOWLEDGE_AGENT_SERVICE_SECRET__' \
            deploy/secrets/keycloak-realm.json deploy/secrets/keycloak-agent-client.json
      - name: Validate Keycloak realm import
        run: |
          # The rendered secret remains owner-only on the runner. Root is scoped to this
          # throwaway nonserver container so Keycloak can read the bind mount on Linux.
          docker run --rm \
            --user 0:0 \
            --volume "$PWD/deploy/secrets/keycloak-realm.json:/tmp/pcbknowledge-realm.json:ro" \
            quay.io/keycloak/keycloak:26.4.7 \
            import --file /tmp/pcbknowledge-realm.json
      - name: Validate Compose model
        run: ./deploy/scripts/compose-check.sh
      - name: Validate OIDC callback log policy and nginx configuration
        run: |
          ./deploy/scripts/check-oidc-log-policy.sh
          docker run --rm \
            --volume "$PWD/deploy/docker/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29.2-alpine nginx -t
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --volume "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            --volume "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine \
            caddy adapt --config /etc/caddy/Caddyfile \
            >"$RUNNER_TEMP/caddy.json"
          CADDY_JSON="$RUNNER_TEMP/caddy.json" python - <<'PY'
          import json
          import os

          with open(os.environ["CADDY_JSON"], encoding="utf-8") as stream:
              config = json.load(stream)
          routes = config["apps"]["http"]["servers"]["srv0"]["routes"]
          expected = {"/auth/callback", "/auth/logout/callback"}
          protected = any(
              expected.issubset(set(matcher.get("path", [])))
              and any(handler.get("log_skip") is True for handler in route.get("handle", []))
              for route in routes
              for matcher in route.get("match", [])
          )
          if not protected:
              raise SystemExit("adapted Caddy config logs an OIDC callback path")
          internal_metrics = {"/metrics", "/api/v1/metrics"}
          metrics_blocked = any(
              internal_metrics.issubset(set(matcher.get("path", [])))
              and any(
                  nested.get("status_code") == 404
                  for handler in route.get("handle", [])
                  for nested_route in handler.get("routes", [])
                  for nested in nested_route.get("handle", [])
              )
              for route in routes
              for matcher in route.get("match", [])
          )
          if not metrics_blocked:
              raise SystemExit("adapted Caddy config exposes the internal metrics endpoint")
          PY
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          --volume "$PWD/deploy/observability:/etc/prometheus:ro"
          prom/prometheus:v3.7.3
          check config /etc/prometheus/prometheus.yml
      - name: Validate OpenTelemetry Collector configuration
        run: >-
          docker run --rm
          --volume "$PWD/deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.139.0
          validate --config=/etc/otelcol-contrib/config.yaml
      - name: Reject tracked runtime secret values
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'deploy/secrets' .dockerignore
          unexpected=$(git ls-files deploy/secrets | grep -Ev '^deploy/secrets/(\.gitignore|README\.md)$' || true)
          test -z "$unexpected" || {
            printf 'tracked runtime secrets are forbidden:\n%s\n' "$unexpected" >&2
            exit 1
          }
